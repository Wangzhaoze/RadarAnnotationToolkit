x-build-proxy-args: &build_proxy_args
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  http_proxy: ${http_proxy:-}
  https_proxy: ${https_proxy:-}
  NO_PROXY: ${NO_PROXY:-}
  no_proxy: ${no_proxy:-}

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: *build_proxy_args
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "3300:3000"
    restart: unless-stopped
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      args: *build_proxy_args
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      APP_STATE_ROOT: /workspace/storage/app_state
      DATASET_PLUGIN_ROOT: /workspace/services/datasets
      RADELFT_RAMAP_PREPROCESS_WORKERS: 6
      RORAD_DATASET_ROOT: /workspace-data/rorad
      WORKER_URL: http://worker-base:8010
      HOST_FILESYSTEM_ROOT: /hostfs
      NO_PROXY: localhost,127.0.0.1,::1,api,web,worker-base,host.docker.internal
      no_proxy: localhost,127.0.0.1,::1,api,web,worker-base,host.docker.internal
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - worker-base
    volumes:
      - ./storage:/workspace/storage
      - C:/:/hostfs/c
      - D:/:/hostfs/d
      - ${RADELFT_DATASET_ROOT:-D:/Datasets/RaDelft}:/workspace-data/radelft
      - ${RORAD_DATASET_ROOT:-D:/Datasets/RoRad}:/workspace-data/rorad:ro

  worker-base:
    build:
      context: .
      dockerfile: services/workers/base/Dockerfile
      args: *build_proxy_args
    environment:
      WORKER_HOST: 0.0.0.0
      WORKER_PORT: 8010
      WORKER_SOURCE_ROOT: /workspace/services/workers/base
      WORKER_CKPT_ROOT: /workspace/services/workers/base/ckpts
      OPENPCDET_SOURCE_ROOT: /workspace/services/workers/base/openpcdet
      OPENPCDET_CKPT_ROOT: /workspace/services/workers/base/ckpts/openpcdet
      WILDDET3D_SOURCE_ROOT: /workspace/services/workers/base/WildDet3D
      WILDDET3D_CKPT_ROOT: /workspace/services/workers/base/ckpts/wilddet3d
      YOLO_SOURCE_ROOT: /workspace/services/workers/base/yolo
      YOLO_CKPT_ROOT: /workspace/services/workers/base/ckpts/yolo
      DATASET_PLUGIN_ROOT: /workspace/services/datasets
      DEFAULT_MODEL_PROFILE_ID: pv_rcnn_kitti
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      NO_PROXY: localhost,127.0.0.1,::1,api,web,worker-base,host.docker.internal
      no_proxy: localhost,127.0.0.1,::1,api,web,worker-base,host.docker.internal
    gpus: all
    restart: unless-stopped
    ports:
      - "8010:8010"
    volumes:
      - ${WORKER_CKPT_ROOT:-./services/workers/base/ckpts}:/workspace/services/workers/base/ckpts:ro
      - ${RADELFT_DATASET_ROOT:-D:/Datasets/RaDelft}:/workspace-data/radelft:ro
      - ${RORAD_DATASET_ROOT:-D:/Datasets/RoRad}:/workspace-data/rorad:ro
